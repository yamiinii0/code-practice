<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- This is a simple non-semantic HTML page -->
    <div>   <!-- container used for other HTML elements also a block element takes full width-->
        <h1>My Website</h1>
    </div>

    <div>
        <h2>My Content</h2>
        <p>This is the main content of the page.</p>
    </div>

    <div>
        <h2>Additional Content</h2>
        <p>This is some additional content.</p>
    </div>

    <div>
        <h2>Article Title</h2>
        <p>This is an article.</p>
    </div>

    <div>
        <h3>Sidebar</h3>
        <p>This is some sidebar content.</p>
    </div>

    <div>
        <h5>Copyright © 2024 My Website</h5>
    </div>

    <span>This is an inline element.</span>
    <span>This is another inline element.</span>
</body>
</html>

<!-- inline elements take up only as much width as they need , also known as span tag -->
